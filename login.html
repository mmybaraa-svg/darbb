<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | دَرْب</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head><body class="auth-page"><div class="auth-wrap"><a class="brand" href="index.html"><span class="brand-mark">د</span><span>دَرْب</span></a><div class="auth-card" style="margin-top:18px"><div class="auth-grid"><aside class="auth-side"><h1>أهلاً بعودتك</h1><p>ادخل إلى حسابك لإدارة رحلاتك وحجوزاتك.</p><div class="notice info">تُحفظ بيانات الحسابات والرحلات على خادم SQL Server.</div></aside><main class="auth-main"><h2>تسجيل الدخول</h2><p class="muted">استخدم بريدك الإلكتروني المسجل.</p><div id="authMsg" class="notice hidden"></div><form id="loginForm"><div class="field"><label for="login">الهاتف أو البريد الإلكتروني</label><input id="login" name="login" autocomplete="username" required></div><div class="field" style="margin-top:14px"><label for="password">كلمة المرور</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" data-password-toggle="#password">إظهار</button></div></div><label style="display:flex;gap:8px;align-items:center;margin:14px 0"><input type="checkbox"> تذكرني</label><button type="button" class="btn btn-outline" id="forgotPassword" style="width:100%;margin-bottom:10px">نسيت كلمة المرور؟</button><button class="btn btn-primary" style="width:100%">تسجيل الدخول</button></form><p class="muted" style="margin-top:18px">ما عندك حساب؟ <a style="color:var(--teal);font-weight:800" href="register.html">أنشئ حساباً</a></p></main></div></div></div><script src="js/script.js"></script><script src="js/auth.js"></script><script>document.getElementById("forgotPassword")?.addEventListener("click",()=>DARB.toast("ميزة استعادة كلمة المرور غير متاحة حاليًا. تواصل مع إدارة الموقع.","info"));</script></body></html>
